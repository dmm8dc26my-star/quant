name: V4 rotating stock universe research
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,10,14,18,22 * * 1-5'
permissions:
  contents: read
concurrency:
  group: v4-universe-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      V4_BATCH_SIZE: '60'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Refresh symbols and scan rotating batch
        run: |
          if [ "$(date -u +%H)" = "06" ]; then export REFRESH_UNIVERSE=true; fi
          python run_universe.py
